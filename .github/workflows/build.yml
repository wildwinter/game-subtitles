name: Build & Test

on:
  workflow_dispatch:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies (root)
        run: npm install

      - name: Install npm dependencies (player)
        run: npm install --prefix players/player-js

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # Godot runs headless with no licence, so the addon is tested here for real, as in the
  # patter and storylets ports workflows. Unity and Unreal are not: their players need the engines.
  godot:
    name: Godot addon
    runs-on: ubuntu-latest

    env:
      GODOT_VERSION: "4.7-stable"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install headless Godot ${{ env.GODOT_VERSION }}
        run: |
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fSL "$url" -o godot.zip
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
          chmod +x godot

      # Checks that every script parses, then runs the tests.
      - name: Test
        run: GODOT="$PWD/godot" npm test --prefix players/player-godot
